<title>Cat Memory</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Mali:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#68483c;--muted:#866a59;--orange:#ee9842}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Mali","Baloo 2",system-ui,sans-serif;background:linear-gradient(180deg,#c7e5c9,#e9e8cb 29%,#f5dfbf 72%,#e8cfad);display:flex;justify-content:center}
.app{width:min(100%,500px);min-height:100vh;padding:22px 15px 26px}
.header{text-align:center;margin:5px 0 13px} .title{display:inline-block;padding:11px 24px 9px;border-radius:27px;background:#fff9eb;border:4px solid #fff;box-shadow:0 8px 20px #5a3d2b24;font-family:"Baloo 2","Mali",sans-serif;font-size:31px;font-weight:800}
.subtitle{font-size:16px;font-weight:700;color:var(--muted);margin-top:6px}
.stats{display:flex;justify-content:center;gap:10px;margin-bottom:14px}
.stat{flex:1;max-width:175px;background:#fff9eb;border:3px solid #fff;border-radius:21px;padding:8px 13px;box-shadow:0 6px 16px #5a3d2b1f;font-size:15px;font-weight:700}
.stat b{display:block;font-family:"Baloo 2",sans-serif;font-size:29px;line-height:1}
.board{width:min(92vw,410px);margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.card{aspect-ratio:376/639;border:0;background:transparent;padding:0;perspective:1000px;cursor:pointer}
.inner{height:100%;width:100%;position:relative;transform-style:preserve-3d;transition:transform .48s cubic-bezier(.2,.75,.2,1)}
.card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:21px;overflow:hidden;border:4px solid #fff;box-shadow:0 8px 18px #53372329;background:#fff4e4}
.front{transform:rotateY(180deg)} .front img,.back img{width:100%;height:100%;object-fit:cover;display:block}
.card.matched .front{box-shadow:0 0 0 4px #f2bd58,0 8px 20px #5337232b}
.message{min-height:34px;text-align:center;font-size:15px;font-weight:700;color:var(--muted);margin:13px 0 6px}
.actions{display:flex;justify-content:center;padding-top:10px} .action{border:0;border-radius:22px;padding:12px 25px;background:var(--orange);color:#fff;font-family:"Mali","Baloo 2",sans-serif;font-size:17px;font-weight:700;box-shadow:0 5px 0 #bd6c2b;cursor:pointer}
.action:active{transform:translateY(3px);box-shadow:0 2px 0 #bd6c2b}
.overlay{position:fixed;inset:0;background:#47302257;display:none;align-items:center;justify-content:center;padding:22px;z-index:20}
.modal{width:min(92vw,380px);background:#fff8e9;border:5px solid #fff;border-radius:30px;padding:25px;text-align:center;box-shadow:0 20px 55px #2d1c0f40}
.modal h2{font-family:"Baloo 2",sans-serif;font-size:34px;margin:0 0 5px} .stars{font-size:42px;margin:4px 0 8px} .modal p{font-weight:700;margin:5px 0 18px}
@media(max-width:370px){.app{padding-left:10px;padding-right:10px}.board{gap:8px}.title{font-size:27px;padding-left:19px;padding-right:19px}}
</style></head><body>
